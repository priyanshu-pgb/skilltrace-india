<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="sopanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="#0f172a" />
  
  <!-- Subtle Inner Border -->
  <rect x="7" y="7" width="106" height="106" rx="25" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Ascending Steps (सोपान - Ladder/Steps of Skill Mobility) -->
  <!-- Step 1 (Foundation) -->
  <rect x="22" y="80" width="18" height="18" rx="4" fill="#3b82f6" opacity="0.9" />
  <path d="M22 80 L32 70 L50 70 L40 80 Z" fill="#60a5fa" opacity="0.5" />

  <!-- Step 2 (Verification) -->
  <rect x="40" y="64" width="18" height="34" rx="4" fill="#6366f1" opacity="0.95" />
  <path d="M40 64 L50 54 L68 54 L58 64 Z" fill="#818cf8" opacity="0.6" />

  <!-- Step 3 (Livelihood & Placement) -->
  <rect x="58" y="48" width="18" height="50" rx="4" fill="#8b5cf6" />
  <path d="M58 48 L68 38 L86 38 L76 48 Z" fill="#a78bfa" opacity="0.6" />

  <!-- Step 4 (Wage Growth & Longevity) -->
  <rect x="76" y="32" width="18" height="66" rx="4" fill="url(#sopanGrad)" />

  <!-- Career Beacon Star at Apex -->
  <g transform="translate(85, 20)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="10" fill="#f59e0b" opacity="0.25" />
    <!-- 8-Point Star -->
    <path d="M0 -12 L3 -4 L11 0 L3 4 L0 12 L-3 4 L-11 0 L-3 -4 Z" fill="url(#starGrad)" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>
</svg>
