{% if messages %}
  <div class="toast-container-fixed" aria-live="polite" aria-atomic="true">
    {% for message in messages %}
      <div class="toast-custom {{ message.tags }}" role="alert">
        <div class="toast-icon">
          {% if message.tags == 'success' %}
            <i class="fa-solid fa-circle-check text-success fs-5"></i>
          {% elif message.tags == 'error' or message.tags == 'danger' %}
            <i class="fa-solid fa-circle-xmark text-danger fs-5"></i>
          {% elif message.tags == 'warning' %}
            <i class="fa-solid fa-triangle-exclamation text-warning fs-5"></i>
          {% else %}
            <i class="fa-solid fa-circle-info text-info fs-5"></i>
          {% endif %}
        </div>
        <div class="flex-grow-1">
          <p class="mb-0 text-dark small fw-medium">{{ message }}</p>
        </div>
        <button type="button" class="btn-close toast-close-btn small" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
